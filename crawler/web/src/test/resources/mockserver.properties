# MockServer keeps a log entry for everything it does, per server. The web
# tests start many servers in one JVM, and crawl pages of several MB, so with
# the default (which grows with the heap) the logs of finished test classes
# fill the heap (millions of LogEntry objects, then OutOfMemoryError).
# The tests do not read this log, so keep very little of it.
mockserver.maxLogEntries=20
mockserver.maxExpectations=100
