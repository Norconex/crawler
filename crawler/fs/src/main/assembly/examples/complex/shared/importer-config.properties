# Implicit variable file for importer-config.xml, in the same directory.
# Because the fragment is #parse'd (interpreted) rather than #include'd
# (verbatim), these variables are resolved when it is pulled in.
#
# This is a .properties file, so Java properties escaping rules apply.
# A .variables file with the same base name would work too, and .properties
# wins when both exist.

collectionName = Norconex sample documents
fieldsToDelete = X-TIKA.*
